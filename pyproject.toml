[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-risk-lab"
version = "0.1.0"
description = "A synthetic-data market risk engineering portfolio project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.14,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39,<2"]

[project.scripts]
market-risk-lab = "market_risk_engine.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pyyaml>=6,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_risk_engine"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/market_risk_engine",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["market_risk_engine"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["market_risk_engine"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
